<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script>
        // Función para recargar la página cada 15 minutos (900000 milisegundos)
        setInterval(()=>{
            window.scrollBy(0, 1);
            window.scrollBy(0, -1);
            window.location.reload();
        }, 6 * 60 * 1000)

    </script>
</head>
<body style="margin: 0px; height: 100%; background-color: rgb(14, 14, 14);">
    <img  style="display: block; margin: auto;cursor: zoom-in;background-color: hsl(0, 0%, 90%);transition: background-color 300ms;" src="ryderomc.png" alt="" width="949" height="953">
</body>
</html>
